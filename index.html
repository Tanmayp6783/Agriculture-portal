<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agriculture Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top-bar">
    <div class="logo">🌾 Agriculture Portal</div>
    <nav class="nav-links">
        <a href="#home">Home</a>
        <a href="#add-product">Add Product</a>
        <a href="#marketplace">Marketplace</a>
    </nav>
</header>

<main>
    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Connect Farmers with Buyers</h1>
            <p>List your crops and reach buyers directly through the agriculture marketplace.</p>
            <a href="#add-product" class="btn-primary">List Your Crop</a>
        </div>
    </section>

    <!-- Add Product Form -->
    <section id="add-product" class="card">
        <h2>Farmer – List Your Crop</h2>
        <form id="productForm">
            <div class="grid">
                <div class="form-group">
                    <label for="farmer_name">Farmer Name</label>
                    <input type="text" id="farmer_name" name="farmer_name" required>
                </div>
                <div class="form-group">
                    <label for="crop_name">Crop Name</label>
                    <input type="text" id="crop_name" name="crop_name" required>
                </div>
                <div class="form-group">
                    <label for="quantity_kg">Quantity (kg)</label>
                    <input type="number" min="1" step="0.01" id="quantity_kg" name="quantity_kg" required>
                </div>
                <div class="form-group">
                    <label for="price_per_kg">Price per kg (₹)</label>
                    <input type="number" min="1" step="0.01" id="price_per_kg" name="price_per_kg" required>
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" required>
                </div>
                <div class="form-group">
                    <label for="contact_phone">Contact Phone</label>
                    <input type="tel" id="contact_phone" name="contact_phone" required>
                </div>
            </div>

            <button type="submit" class="btn-primary full-width">Submit Listing</button>
            <p id="formMessage" class="message"></p>
        </form>
    </section>

    <!-- Marketplace Section -->
    <section id="marketplace" class="card">
        <div class="section-header">
            <h2>Available Crops</h2>
            <input type="text" id="searchInput" placeholder="Search by crop or location...">
        </div>
        <div id="productsContainer" class="products-grid">
            <!-- JS will inject product cards here -->
        </div>
        <p id="listMessage" class="message"></p>
    </section>
</main>

<footer class="footer">
    <p>© 2025 Agriculture Portal. All rights reserved.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
